spring.application.name=Captcha

# =========================================================
# COMO FUNCIONAM AS CHAVES
# ---------------------------------------------------------
# Formato: propriedade=${VARIAVEL_DE_AMBIENTE:valor_padrao}
#
# O Spring usa a variável de ambiente se ela existir e,
# caso contrário, usa o valor padrão depois dos dois-pontos.
#
# Os valores padrão abaixo são CHAVES DE TESTE oficiais
# de cada provedor: o captcha sempre passa. Servem só
# para desenvolvimento. Em produção, defina as variáveis
# de ambiente com as suas chaves reais.
#
# NUNCA coloque a SECRET KEY real neste arquivo se o
# repositório for público.
# =========================================================


# =========================================================
# GOOGLE reCAPTCHA v2 - CHECKBOX ("Não sou um robô")
# Chaves: https://www.google.com/recaptcha/admin
# =========================================================

recaptcha.v2.checkbox.site-key=${RECAPTCHA_V2_CHECKBOX_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
recaptcha.v2.checkbox.secret-key=${RECAPTCHA_V2_CHECKBOX_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TRnWxEg4jB4kFGeWtxJ-FXM}


# =========================================================
# GOOGLE reCAPTCHA v2 - INVISÍVEL
# Ao criar a chave, escolha "v2 > Selo invisível"
# =========================================================

recaptcha.v2.invisivel.site-key=${RECAPTCHA_V2_INVISIVEL_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
recaptcha.v2.invisivel.secret-key=${RECAPTCHA_V2_INVISIVEL_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TRnWxEg4jB4kFGeWtxJ-FXM}


# =========================================================
# GOOGLE reCAPTCHA v3 (pontuação de 0.0 a 1.0)
# O Google NÃO oferece chave de teste para o v3:
# crie uma chave v3 e adicione "localhost" nos domínios.
# =========================================================

recaptcha.v3.site-key=${RECAPTCHA_V3_SITE_KEY:6LcQVsstAAAAAMu9gN4QzzGI3C3rUOkJ3X6FBYHe}
recaptcha.v3.secret-key=${RECAPTCHA_V3_SECRET_KEY:6LcQVsstAAAAAGtN8v4muFw7KuujgfdNJlGUp2OI}
recaptcha.v3.score-minimo=0.5


# =========================================================
# hCAPTCHA
# Chaves: https://dashboard.hcaptcha.com
# =========================================================

hcaptcha.site-key=${HCAPTCHA_SITE_KEY:6fb44464-ebde-4880-bd66-afd6f2786006}
hcaptcha.secret-key=${HCAPTCHA_SECRET_KEY:6fb44464-ebde-4880-bd66-afd6f2786006}


# =========================================================
# CLOUDFLARE TURNSTILE
# Chaves: https://dash.cloudflare.com > Turnstile
# =========================================================

turnstile.site-key=${TURNSTILE_SITE_KEY:0x4AAAAAAFBUUUVENHqWfPdc}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:0x4AAAAAAFBUUYn9DPHti7kx8xTOnJIMeBc}


# =========================================================
# ALTCHA (prova de trabalho, sem conta em nenhum serviço)
# A chave HMAC é inventada por você: qualquer texto longo
# e aleatório. Troque em produção.
# =========================================================

altcha.hmac-key=${ALTCHA_HMAC_KEY:OT_JxTlu5CT9jLgh7LLxgXUcawCK66C95ZYZ1NIFJWdoxApoS7XnguPaFDDe-sMD}
altcha.max-number=100000
altcha.validade-minutos=10


# =========================================================
# CAPTCHA DE IMAGEM e CAPTCHA MATEMÁTICO
# Gerados pelo próprio projeto. Não precisam de chave.
# =========================================================

captcha.imagem.tamanho=5
