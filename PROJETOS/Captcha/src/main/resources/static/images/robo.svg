<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Robô tentando marcar a caixa "Não sou um robô"</title>

  <!-- Fundo -->
  <circle cx="240" cy="195" r="172" fill="#e3ecf7"/>
  <ellipse cx="300" cy="360" rx="92" ry="11" fill="#c9d3e3"/>

  <!-- Balão de dúvida -->
  <circle cx="392" cy="62" r="26" fill="#ffffff" stroke="#15213b" stroke-width="3"/>
  <path d="M372 82 L366 96 L382 86 Z" fill="#ffffff" stroke="#15213b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M372 83 L382 86" stroke="#ffffff" stroke-width="4"/>
  <text x="392" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0c4a8c">?</text>

  <!-- Caixa do captcha -->
  <rect x="24" y="262" width="206" height="66" rx="10" fill="#ffffff" stroke="#b7c0d0" stroke-width="2"/>
  <rect x="42" y="280" width="30" height="30" rx="5" fill="#ffffff" stroke="#15213b" stroke-width="3"/>
  <text x="86" y="301" font-family="Arial, sans-serif" font-size="16" fill="#15213b">Não sou um robô</text>

  <!-- Antena -->
  <line x1="300" y1="78" x2="300" y2="46" stroke="#15213b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="38" r="10" fill="#f2b53a" stroke="#15213b" stroke-width="3"/>

  <!-- Orelhas -->
  <rect x="215" y="114" width="18" height="44" rx="7" fill="#15213b"/>
  <rect x="367" y="114" width="18" height="44" rx="7" fill="#15213b"/>

  <!-- Cabeça -->
  <rect x="228" y="78" width="144" height="114" rx="30" fill="#0c4a8c"/>
  <rect x="246" y="100" width="108" height="66" rx="20" fill="#15213b"/>

  <!-- Olhos olhando para a caixa -->
  <circle cx="278" cy="132" r="13" fill="#e3ecf7"/>
  <circle cx="322" cy="132" r="13" fill="#e3ecf7"/>
  <circle cx="273" cy="137" r="6" fill="#15213b"/>
  <circle cx="317" cy="137" r="6" fill="#15213b"/>
  <!-- Sobrancelha levantada -->
  <path d="M308 110 Q322 102 336 110" stroke="#e3ecf7" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Gota de suor -->
  <path d="M384 96 C378 106 376 112 382 116 C388 118 392 112 390 106 Z" fill="#7cc4f5" stroke="#15213b" stroke-width="2"/>

  <!-- Pescoço -->
  <rect x="284" y="190" width="32" height="16" fill="#15213b"/>

  <!-- Braço esticado até a caixa -->
  <path d="M246 228 C205 232 140 214 80 262" stroke="#0c4a8c" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="76" cy="265" r="12" fill="#15213b"/>
  <line x1="68" y1="272" x2="60" y2="278" stroke="#15213b" stroke-width="6" stroke-linecap="round"/>

  <!-- Outro braço -->
  <path d="M354 228 C380 244 390 268 388 296" stroke="#0c4a8c" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="388" cy="302" r="12" fill="#15213b"/>

  <!-- Corpo -->
  <rect x="244" y="204" width="112" height="112" rx="24" fill="#0c4a8c"/>
  <rect x="266" y="226" width="68" height="42" rx="9" fill="#e3ecf7"/>
  <circle cx="283" cy="247" r="6.5" fill="#17714a"/>
  <circle cx="300" cy="247" r="6.5" fill="#f2b53a"/>
  <circle cx="317" cy="247" r="6.5" fill="#b42318"/>
  <rect x="274" y="284" width="52" height="8" rx="4" fill="#15213b"/>

  <!-- Pernas -->
  <rect x="266" y="312" width="24" height="40" rx="7" fill="#15213b"/>
  <rect x="310" y="312" width="24" height="40" rx="7" fill="#15213b"/>
  <rect x="258" y="346" width="40" height="14" rx="7" fill="#15213b"/>
  <rect x="302" y="346" width="40" height="14" rx="7" fill="#15213b"/>
