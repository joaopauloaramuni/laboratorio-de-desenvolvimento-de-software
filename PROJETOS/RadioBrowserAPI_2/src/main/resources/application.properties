spring.application.name=RadioBrowserAPI
radio.api.base.url=https://de1.api.radio-browser.info/json

# ---------- Supabase (PostgreSQL) ----------
# Use a connection string do "Session pooler" (porta 5432) em
# Supabase > Project Settings > Database > Connection string > JDBC.
# Os valores vêm de variáveis de ambiente para não versionar a senha.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ylipuhoquysqlxtcyrbv
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno: o plano free do Supabase limita conexões
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Cria/atualiza a tabela "favorites" automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
