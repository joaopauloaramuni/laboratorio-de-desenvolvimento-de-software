<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Área Administrativa - PUC Minas</title>

    <!-- Fonte Montserrat - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>

  <body>
    <div class="admin-container">
      <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

      <div class="admin-header">
        <img th:src="@{/images/pucminas-logo.png}" alt="Logo PUC Minas" />

        <span> PUC MINAS </span>
      </div>

      <!-- =====================================================
         CONTEÚDO ADMINISTRATIVO
         ===================================================== -->

      <div class="admin-content">
        <span class="admin-label"> ÁREA ADMINISTRATIVA </span>

        <h1>Admin Page</h1>

        <p class="admin-message">Bem-vindo à área administrativa!</p>

        <div class="admin-divider"></div>

        <p class="admin-description">
          Usuário:
          <strong th:text="${usuario}"></strong>
        </p>

        <p class="admin-description">
          Você está acessando uma área restrita do sistema.
        </p>

        <!-- =================================================
             LOGOUT
             ================================================= -->

        <form th:action="@{/logout}" method="post">
          <button type="submit" class="admin-btn">Sair</button>
        </form>
      </div>
    </div>
  </body>
</html>
