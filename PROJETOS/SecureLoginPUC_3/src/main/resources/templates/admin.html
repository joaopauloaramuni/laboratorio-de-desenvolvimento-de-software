<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área Administrativa - PUC Minas</title>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div class="admin-header">

        <img th:src="@{/images/pucminas-logo.png}" alt="Logo PUC Minas">

        <span>PUC MINAS</span>

    </div>

    <div class="admin-content">

        <span class="admin-label">ÁREA ADMINISTRATIVA</span>

        <h1>Admin Page</h1>

        <p class="admin-message">
            Bem-vindo à área administrativa!
        </p>

        <div class="admin-divider"></div>

        <p class="admin-description">
            Usuário: <strong th:text="${usuario}"></strong>
        </p>

        <p class="admin-description">
            Você está acessando uma área restrita do sistema.
        </p>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="admin-btn">Sair</button>
        </form>

    </div>

</div>

</body>
</html>
