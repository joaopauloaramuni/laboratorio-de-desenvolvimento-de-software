<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha - PUC Minas</title>

    <link rel="stylesheet"
          th:href="@{/css/recoverpassword.css}">

</head>

<body>

<div class="recover-container">

    <!-- =====================================================
         ÁREA DA LOGO
         ===================================================== -->

    <div class="recover-image-logo-container">

        <img th:src="@{/images/pucminas-logo.png}"
             alt="Logo PUC Minas">

    </div>


    <!-- =====================================================
         FORMULÁRIO DE RECUPERAÇÃO
         ===================================================== -->

    <div class="recover-form">

        <form th:action="@{/recoverpassword}"
              method="post">

            <!-- TÍTULO -->

            <h2 class="recover-title">
                Recuperar senha
            </h2>


            <!-- DESCRIÇÃO -->

            <p class="recover-description">

                Informe seu e-mail para receber
                as instruções de recuperação da senha.

            </p>


            <!-- =================================================
                 MENSAGEM DE ERRO
                 Exibida quando o e-mail não está cadastrado.
                 ================================================= -->

            <div th:if="${param.erro}"
                 class="recover-message recover-message-error">

                <strong>
                    E-mail não encontrado!
                </strong>

                <span>
                    O e-mail informado não está cadastrado.
                </span>

            </div>


            <!-- =================================================
                 MENSAGEM DE SUCESSO
                 Exibida depois que o e-mail foi enviado.
                 ================================================= -->

            <div th:if="${param.sucesso}"
                 class="recover-message recover-message-success">

                <strong>
                    Link enviado com sucesso!
                </strong>

                <span>
                    Verifique seu e-mail para continuar
                    a recuperação da senha.
                </span>

            </div>


            <!-- =================================================
                 CAMPO DE E-MAIL
                 ================================================= -->

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="E-mail"
                   autocomplete="email"
                   required>


            <!-- =================================================
                 BOTÃO
                 ================================================= -->

            <div class="recover-button-container">

                <button type="submit">
                    Recuperar senha
                </button>

            </div>


            <!-- =================================================
                 LINK PARA LOGIN
                 ================================================= -->

            <div class="recover-redirect-options">

                Lembrou sua senha?

                <a th:href="@{/login}">
                    Faça login
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
