<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha - PUC Minas</title>

    <link rel="stylesheet" th:href="@{/css/resetpassword.css}">
</head>

<body>

<div class="reset-container">

    <!-- Logo PUC Minas -->
    <div class="reset-image-logo-container">
        <img
            th:src="@{/images/pucminas-logo.png}"
            alt="Logo PUC Minas"
        >
    </div>

    <!-- Formulário -->
    <div class="reset-form">

        <form th:action="@{/resetpassword}" method="post">

            <h2 class="reset-title">
                Redefinir senha
            </h2>

            <p class="reset-description">
                Digite sua nova senha abaixo.
            </p>

            <!-- Mensagem de erro: senhas diferentes -->
            <div
                th:if="${param.erro != null and param.erro[0] == 'senhas'}"
                class="reset-message reset-message-error"
            >
                <strong>Senhas diferentes!</strong>
                <span>
                    As senhas informadas não são iguais.
                </span>
            </div>

            <!-- Token recebido através do link do e-mail -->
            <input
                type="hidden"
                name="token"
                th:value="${token}"
            >

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Nova senha"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                placeholder="Confirmar nova senha"
                autocomplete="new-password"
                required
            >

            <div class="reset-button-container">
                <button type="submit">
                    Redefinir senha
                </button>
            </div>

            <div class="reset-redirect-options">

                <a th:href="@{/login}">
                    Voltar para o login
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
