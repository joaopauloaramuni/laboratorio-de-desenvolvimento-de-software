<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="app-header">
    <h1>TaskFlow</h1>
    <p>Gerenciamento simples de tarefas, com API REST e arquitetura em camadas</p>
</header>

<main class="container">

    <!-- Formulario de criacao de tarefa -->
    <section class="card">
        <h2>Nova tarefa</h2>
        <form id="task-form">
            <input type="hidden" id="task-id">

            <label for="title">Titulo</label>
            <input type="text" id="title" required placeholder="Ex: Finalizar relatorio mensal">

            <label for="description">Descricao</label>
            <textarea id="description" placeholder="Detalhes da tarefa (opcional)"></textarea>

            <label for="deadline">Prazo</label>
            <input type="date" id="deadline" required>

            <button type="submit" id="submit-btn">Adicionar tarefa</button>
            <button type="button" id="cancel-edit-btn" style="display:none;">Cancelar edicao</button>
        </form>
    </section>

    <!-- Relatorio de produtividade -->
    <section class="card">
        <h2>Relatorio de produtividade</h2>
        <div id="report" class="report-grid"></div>
    </section>

    <!-- Lista / filtro de tarefas -->
    <section class="card">
        <div class="list-header">
            <h2>Tarefas</h2>
            <div class="filters">
                <button class="filter-btn active" data-status="">Todas</button>
                <button class="filter-btn" data-status="PENDENTE">Pendentes</button>
                <button class="filter-btn" data-status="EM_ANDAMENTO">Em andamento</button>
                <button class="filter-btn" data-status="CONCLUIDA">Concluidas</button>
            </div>
        </div>
        <table id="task-table">
            <thead>
            <tr>
                <th>Titulo</th>
                <th>Prazo</th>
                <th>Status</th>
                <th>Acoes</th>
            </tr>
            </thead>
            <tbody id="task-table-body">
            <!-- preenchido via JavaScript, consumindo GET /api/tasks -->
            </tbody>
        </table>
    </section>

</main>

<footer class="app-footer">
    <p>TaskFlow &mdash; projeto de estudo (Spring Boot + Thymeleaf + REST API)</p>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
