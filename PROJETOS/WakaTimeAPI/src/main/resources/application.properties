spring.application.name=WakaTimeAPI

# Endereço base da API: a conta dona do token (users/current). Os serviços
# acrescentam /stats/{periodo}, /status_bar/today, /heartbeats e /user_agents.
wakatime.api.url=https://api.wakatime.com/api/v1/users/current

# ---------------------------------------------------------------------------
# WakaTime OAuth
#
# A partir de 01/11/2026 a API key do WakaTime só serve para os plugins
# mandarem dados; para ler, a API exige um token OAuth, enviado no cabeçalho
# "Authorization: Bearer <token>".
#
# Como obter (uma vez só):
#   1. Crie um app em https://wakatime.com/apps com o Redirect URI
#      http://localhost:8787/callback
#   2. Troque SEU_APP_ID_AQUI e SEU_APP_SECRET_AQUI abaixo
#   3. Na raiz do projeto, rode: java scripts/WakaTimeOAuth.java
#      Ele abre a autorização (escopos read_stats, read_summaries e
#      read_heartbeats), recebe o callback e imprime o access token e o
#      refresh token para colar aqui.
#
# Troque cada SEU_..._AQUI pelo valor real. Antes de subir o projeto para o
# GitHub, volte os valores para SEU_..._AQUI: nunca faça commit do App Secret
# nem dos tokens.
# ---------------------------------------------------------------------------

# Obrigatório: o token que vai no "Authorization: Bearer"
wakatime.oauth.access-token=SEU_ACCESS_TOKEN_AQUI

# Opcionais: renovação automática. Quando o access token expira (HTTP 401), o
# serviço usa o refresh token para pedir outro. Sem estas três, é só rodar o
# script de novo e trocar o access token. O App ID e o App Secret também são
# lidos pelo scripts/WakaTimeOAuth.java.
wakatime.oauth.app-id=SEU_APP_ID_AQUI
wakatime.oauth.app-secret=SEU_APP_SECRET_AQUI
wakatime.oauth.refresh-token=SEU_REFRESH_TOKEN_AQUI

# Endereço onde o WakaTime troca o refresh token por um access token novo
wakatime.oauth.token-url=https://wakatime.com/oauth/token

# Opcional (só é usado quando NÃO há token, ou se ele falhar): usuário com
# perfil público. O painel lê /users/{username}/stats/{periodo} sem
# autenticação; o perfil precisa estar público em
# wakatime.com/settings/profile. Nesse modo o indicador "Hoje" e o
# "Codando agora" não aparecem (os dois usam dados privados).
wakatime.username=

# ---------------------------------------------------------------------------
# Painel de estatísticas (escopos read_stats e read_summaries)
# ---------------------------------------------------------------------------

# Período aberto ao carregar a página:
# last_7_days, last_30_days, last_6_months, last_year ou all_time
wakatime.panel.default-range=all_time

# Link do seu perfil público (deixe vazio para esconder o botão)
wakatime.panel.profile-url=https://wakatime.com/@aramuni

# Quantas linguagens aparecem na lista (o resto vira "+ N outras")
wakatime.panel.max-languages=10

# Linguagens que você não quer mostrar, separadas por vírgula (ex.: Text,Other)
wakatime.panel.hidden-languages=

# false esconde os nomes dos projetos (ex.: projetos de cliente), no painel e
# no Codando agora
wakatime.panel.show-projects=true

# ---------------------------------------------------------------------------
# Codando agora (escopo read_heartbeats)
# ---------------------------------------------------------------------------

# Fuso da sua conta no WakaTime (wakatime.com/settings/preferences): é por
# ele que a API separa os dias
wakatime.coding-now.timezone=America/Sao_Paulo

# Último heartbeat há até tantos minutos = "codando agora". A extensão manda
# um a cada ~2 min enquanto você digita.
wakatime.coding-now.active-minutes=10

# Pausa maior que isso encerra a sessão (mesmo timeout padrão do WakaTime)
wakatime.coding-now.break-minutes=15

# De quanto em quanto tempo a página pergunta de novo
wakatime.coding-now.refresh-seconds=60

# Projetos que aparecem pelo nome (com a branch), separados por vírgula.
# "*" = todos. Para esconder projetos de cliente, troque por uma lista, ex.:
# meu-portfolio,WakaTimeAPI. O nome é o que o WakaTime mostra no dashboard
# (em geral, o nome da pasta).
wakatime.coding-now.public-projects=*

# Projeto fora da lista: true = aparece como "projeto privado" (sem nome e sem
# branch); false = o cartão nem aparece
wakatime.coding-now.show-private=true
